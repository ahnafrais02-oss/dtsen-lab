<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pengujian UI DTSEN Lab</title>
<style>body{margin:24px;font:14px system-ui;background:#f5f6f1;color:#20382b}h1{font-size:24px}button,select{font:inherit;padding:10px;margin:4px;border:1px solid #a7b59e;border-radius:6px;background:white}pre{white-space:pre-wrap;max-height:260px;overflow:auto;padding:16px;background:white;border:1px solid #d6dece}#stage{overflow:auto;padding:12px 0}iframe{display:block;background:white;border:1px solid #a7b59e;height:800px}label{font-weight:600}.failed{color:#9f241a}.passed{color:#225d35}</style></head>
<body><h1>Pengujian alur dan layout DTSEN Lab</h1><p>Jalankan melalui Live Server atau server HTTP lokal. Pengujian menggunakan halaman aplikasi asli di dalam frame.</p><button id="run">Jalankan semua pemeriksaan UI</button><label for="viewport">Lebar preview</label><select id="viewport"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select><button id="home">Lihat beranda</button><button id="lab">Lihat papan</button><button id="result">Lihat hasil</button><p id="summary" role="status">Siap.</p><pre id="report" role="status">Siap.</pre><div id="stage"><iframe id="app" src="../index.html" width="390" title="Preview aplikasi DTSEN Lab"></iframe></div><script src="ui.test.js"></script></body></html>
